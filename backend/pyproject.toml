[project]
name = "bushfire-sim"
version = "0.1.0"
description = "Research-grade multi-agent UAV wildfire detection simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.0.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "torch>=2.5.0",
    "pettingzoo>=1.24.3",
    "gymnasium>=1.0.0",
    "websockets>=14.0",
    "scipy>=1.14.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
